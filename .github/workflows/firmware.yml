# Збірка прошивки (PlatformIO, обидві плати) і публікація OTA-релізу v<FW_VERSION>.
# Реліз створюється, лише якщо такого тегу ще немає: щоб пристрої оновились — підвищте FW_VERSION у include/version.h.
# Асети: firmware-<env>.bin (OTA), cyd-full-<env>.bin (кабелем з 0x0), version.json (маніфест для ESP).
name: firmware

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "include/**"
      - "platformio.ini"
      - "partitions_ota.csv"
      - "tools/gen_data.py"
      - "tools/fw_release.py"
      - "data/locations.json"
      - "data/rules.json"
      - "data/channels.json"
      - "data/city_regions.json"
      - "data/outages.json"
      - "data/streets_*.json"
      - ".github/workflows/firmware.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: firmware
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio/libdeps
          key: pio-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-
      - name: Install PlatformIO
        run: pip install -q platformio
      - name: Build
        run: pio run -e cyd -e cyd2usb
      - name: Package
        run: python tools/fw_release.py --out dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(python tools/fw_release.py --version)
          if gh release view "v$VER" >/dev/null 2>&1; then
            echo "::notice::v$VER вже опубліковано — щоб пристрої оновились, підвищте FW_VERSION у include/version.h"
            exit 0
          fi
          gh release create "v$VER" dist/* --target "$GITHUB_SHA" --latest \
            --title "CYD Alert v$VER" \
            --notes "Прошивка v$VER. Пристрої з увімкненим «Автооновлення» встановлять її самі (перевірка раз на 6 год, не під час загрози). Кабелем: esptool write_flash 0x0 cyd-full-<плата>.bin"
