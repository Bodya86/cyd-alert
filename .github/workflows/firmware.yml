# Збірка прошивки (PlatformIO, обидві плати) і публікація OTA-релізу v<FW_VERSION> у ТЕСТОВИЙ (бета) канал:
# реліз створюється як prerelease (не «latest») + version.json копіюється в реліз «beta». Бета-пристрої
# (Налаштування → «Тестові оновлення») ставлять його одразу; стабільні — лише після витримки (fw-promote.yml, 24 год).
# Реліз створюється, лише якщо такого тегу ще немає: щоб пристрої оновились — підвищте FW_VERSION у include/version.h.
# Асети: firmware-<env>.bin (OTA), cyd-full-<env>.bin (кабелем з 0x0), version.json (маніфест для ESP).
name: firmware

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "include/**"
      - "platformio.ini"
      - "partitions_ota.csv"
      - "tools/gen_data.py"
      - "tools/fw_release.py"
      - "data/locations.json"
      - "data/rules.json"
      - "data/channels.json"
      - "data/city_regions.json"
      - "data/outages.json"
      - "data/streets_*.json"
      - ".github/workflows/firmware.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: firmware
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio/libdeps
          key: pio-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-
      - name: Install PlatformIO
        run: pip install -q platformio
      - name: Build
        run: pio run -e cyd -e cyd2usb
      - name: Package
        run: python tools/fw_release.py --out dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(python tools/fw_release.py --version)
          if gh release view "v$VER" >/dev/null 2>&1; then
            echo "::notice::v$VER вже опубліковано — щоб пристрої оновились, підвищте FW_VERSION у include/version.h"
            exit 0
          fi
          gh release create "v$VER" dist/* --target "$GITHUB_SHA" --prerelease \
            --title "CYD Alert v$VER" \
            --notes "Прошивка v$VER — БЕТА. Пристрої з «Тестові оновлення» встановлять її одразу; решта — після 24 год витримки (workflow fw-promote). Щоб зупинити просування в стабільний канал — допишіть HOLD у нотатки цього релізу. Кабелем: esptool write_flash 0x0 cyd-full-<плата>.bin"
          if ! gh release view beta >/dev/null 2>&1; then
            gh release create beta --target "$GITHUB_SHA" --prerelease --title "Beta channel (OTA manifest)" \
              --notes "Службовий реліз: version.json тестового каналу OTA. Не видаляти."
          fi
          gh release upload beta dist/version.json --clobber
          echo "::notice::v$VER опубліковано в бета-канал; стабільний — після витримки (fw-promote.yml)"
