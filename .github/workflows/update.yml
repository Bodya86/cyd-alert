# Резервна копія даних CYD Alert на GitHub Pages раз на годину (+ дашборд index.html).
# Свіжі дані щохвилини публікує live.yml у гілку `data` — дашборд і ESP читають насамперед її.
# Увімкнути: Settings → Pages → Build and deployment → Source: «GitHub Actions».
# Увага: розклад GitHub (cron) не гарантований — запуски можуть запізнюватись на 5–20 хв або пропускатися
# при навантаженні; ESP тому сам читає тривоги/Telegram напряму, а з Pages бере прогноз цілей і графіки.
name: update-static

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # стан фільтрів частинок між запусками (резерв — tracker_state.json з опублікованого сайту)
      - name: Restore tracker state
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: tracker-${{ github.run_id }}
          restore-keys: tracker-

      # найсвіжіший стан трекера — з гілки data (live.yml), якщо вона вже є
      - name: Tracker state from data branch
        continue-on-error: true
        run: |
          mkdir -p .state
          if git fetch -q --depth=1 origin data && git show FETCH_HEAD:tracker_state.json > /tmp/ts.json && [ -s /tmp/ts.json ]; then
            mv /tmp/ts.json .state/tracker_state.json
          fi

      - name: Build static API
        env:
          TZ: Europe/Kyiv
          UKRAINEALARM_KEY: ${{ secrets.UKRAINEALARM_KEY }}
          ALERTS_TOKEN: ${{ secrets.ALERTS_TOKEN }}
          STATE_URL: https://bodya86.github.io/cyd-alert/tracker_state.json
        run: |
          mkdir -p .state
          python server/build_static.py --out public --state .state/tracker_state.json --jaam-wait 18
          du -sh public; find public -type f | wc -l

      - name: Save tracker state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .state
          key: tracker-${{ github.run_id }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deploy
        uses: actions/deploy-pages@v4
