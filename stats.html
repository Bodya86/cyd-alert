<script>
const CAL=[{"ts": 1793259163, "waves": 204, "val_waves": 30, "holdout_waves": 30, "holdout_steps": 6117, "current": {"trk_w": 0.3, "prior_mix": 0.6}, "proposed": {"trk_w": 0.3, "prior_mix": 0.8}, "holdout": {"current": {"ll": -2.0288, "top1": 0.201}, "proposed": {"ll": -2.0343, "top1": 0.201}, "uniform": {"ll": -2.0794, "top1": 0.125}}, "accepted": false}], BT={"backtest": {"next_dir": {"explicit_heading": {"n": 4200, "covered": 2769, "uniform": {"n": 4200, "top1": 0.117, "ll_per_step": -2.079}, "field": {"n": 4200, "top1": 0.223, "ll_per_step": -1.986}}, "chained_positions": {"n": 2607, "covered": 1840, "uniform": {"n": 2607, "top1": 0.105, "ll_per_step": -2.079}, "field": {"n": 2607, "top1": 0.164, "ll_per_step": -2.163}, "persist": {"n": 939, "top1": 0.115, "ll_per_step": -3.332}}}, "target": {"n": 1897, "distance_only": {"top1": 0.247, "top3": 0.484, "ll_per_case": -2.855}, "hits_prior": {"top1": 0.326, "top3": 0.57, "ll_per_case": -2.608}, "history_prior": {"top1": 0.325, "top3": 0.572, "ll_per_case": -2.597}}, "params": {"base": 2.0, "gamma": 0.7, "lam": 60.0}}, "built": 1793227856, "stats": {"posts": 39828, "channels": {"eRadarrua": 4153, "kpszsu": 4400, "kremen_sv": 4210, "kudy_letyt": 4397, "mon1tor_ua": 4375, "monitor1654": 4390, "poltava_monitor": 3055, "ppo_poltava": 4155, "raketa_trevoga": 242, "vanek_nikolaev": 2120, "war_monitor": 4331}, "first": 1679144901, "last": 1793225970, "events": 54288, "events_by_kind": {"head": 27864, "pos": 25861, "hit": 563}, "waves": 204, "train_waves": 163, "test_waves": 41, "split_ts": 1787756551, "transitions": 7369, "transitions_by_src": {"trk": 2816, "head": 4553}, "cells": 1022, "build_s": 23.3}}, PRM={"trk_w": 0.3, "prior_mix": 0.6, "news_beta": 0.0, "news_hl_days": 3.0, "news_backtest": {"scheme": "val = перша половина тестових хвиль, test = друга", "news_items": 7432, "news_events": 3886, "news_cover_from": 1787069015, "val_n": 948, "test_n": 949, "chosen": {"beta": 0.05, "hl_days": 3.0}, "val": [0.398, 0.612, -2.422], "test_history_only": {"top1": 0.26, "top3": 0.529, "ll": -2.768}, "test_history_plus_news": {"top1": 0.255, "top3": 0.522, "ll": -2.802}, "enabled": false}, "motion": {"jet": {"v": [350, 80]}, "shahed": {"ttl": 1500}}, "motion_backtest": {"tool": "tools/backtest_tracker.py", "period": "2026-08-01..2026-10-29", "split": "2026-10-12", "metric": "track p30 BSS (ціль ≤15 км від Кременчука за 30 хв)", "grid": "shahed v 150/170/190, turn 2/3/5, ttl 25/35/50 хв; jet v 350/450, ttl 15/25 хв", "chosen": "jet v 350±80, shahed ttl 25 хв (інше без змін: shahed 170±15, turn 3; cruise 800±80)", "observed_speeds_kmh": {"shahed": {"n": 20, "median": 194, "p25": 158, "p75": 249}, "jet": {"n": 44, "median": 439, "p25": 314, "p75": 549}}, "result_track_p30": {"baseline_2c0533f": {"train": 0.236, "holdout": 0.082, "all": 0.235, "holdout_hit@0.15": 0.608, "holdout_prec@0.15": 0.208}, "final": {"train": 0.331, "holdout": 0.431, "all": 0.395, "holdout_hit@0.15": 0.88, "holdout_prec@0.15": 0.429}}}, "city_cal": {"enabled": true, "method": "platt σ(a·logit(p)+b), fit on train < 2026-10-12", "truth": "сире положення класу ≤ 15 км від kremenchuk за T хв", "params": {"any": {"5": [0.2868, -3.2729], "15": [0.2108, -2.6575], "30": [0.1725, -2.1992]}, "drone": {"5": [0.1355, -4.0311], "15": [0.1152, -3.1928], "30": [0.0982, -2.6542]}}, "holdout_bss": {"any5": {"raw": -5.187, "cal": -0.005}, "any15": {"raw": -1.975, "cal": 0.005}, "any30": {"raw": -0.915, "cal": 0.009}, "drone5": {"raw": -2.964, "cal": 0.002}, "drone15": {"raw": -1.258, "cal": 0.006}, "drone30": {"raw": -0.573, "cal": 0.008}}}, "fc_turn": 2.0, "fc_turn_note": "дифузія курсу в прогнозі ×turn (виляння); backtest 2026-10-30: holdout track_p30 BSS 0.431→0.432, hit@.15 0.88=, prec@.15 0.429=; 4 гірше"};
const GH=location.hostname.match(/^([^.]+)\.github\.io$/),REPO=location.pathname.split('/')[1];
const RAW=GH&&REPO?`https://raw.githubusercontent.com/${GH[1]}/${REPO}/data/`:null;
const J=async u=>{for(const b of (RAW?[RAW,'']:[''])){try{const r=await fetch(b+u+'?t='+Date.now());if(r.ok)return r.json()}catch(e){}}return null};
const P=v=>v==null?'—':Math.round(v*100)+'%';
const t=s=>s?new Date(s*1000).toLocaleString('uk',{dateStyle:'short',timeStyle:'short'}):'—';
const C={dir1:'#58a6ff',dir3:'#1f6feb',tgt1:'#ff8c1a',tgt3:'#f2c94c'};
function bars(rows,keys,names){const W=760,H=180,gw=W/rows.length,bw=Math.min(28,(gw-20)/keys.length);let s=`<svg viewBox="0 0 ${W} ${H+34}">`;
 for(let y=0;y<=4;y++){const yy=10+H-H*y/4;s+=`<line x1=0 x2=${W} y1=${yy} y2=${yy} stroke=#21262d /><text x=2 y=${yy-2} fill=#8b949e font-size=10>${y*25}%</text>`}
 rows.forEach((r,i)=>{keys.forEach((k,j)=>{const v=r[k];if(v==null)return;const h=H*v,x=i*gw+20+j*(bw+3);
  s+=`<rect x=${x} y=${10+H-h} width=${bw} height=${h} fill=${C[k]} rx=3 /><text x=${x+bw/2} y=${6+H-h} fill=#e6edf3 font-size=10 text-anchor=middle>${Math.round(v*100)}</text>`});
  s+=`<text x=${i*gw+gw/2} y=${H+28} fill=#8b949e font-size=12 text-anchor=middle>${names[i]}</text>`});return s+'</svg>'}
function lines(rows,keys,base){const W=760,H=170;if(rows.length<2)return '<p class=mut>Замало днів для графіка — накопичується.</p>';
 let s=`<svg viewBox="0 0 ${W} ${H+30}">`;const x=i=>30+i*(W-40)/(rows.length-1),y=v=>10+H-H*v;
 for(let g=0;g<=4;g++)s+=`<line x1=30 x2=${W} y1=${y(g/4)} y2=${y(g/4)} stroke=#21262d /><text x=0 y=${y(g/4)+3} fill=#8b949e font-size=10>${g*25}%</text>`;
 if(base)s+=`<line x1=30 x2=${W} y1=${y(base)} y2=${y(base)} stroke=#8b949e stroke-dasharray="5 5" />`;
 keys.forEach(k=>{const pts=rows.map((r,i)=>r[k]==null?null:[x(i),y(r[k])]).filter(Boolean);if(pts.length)s+=`<polyline fill=none stroke=${C[k]} stroke-width=2.5 points="${pts.map(p=>p.join(',')).join(' ')}"/>`+pts.map(p=>`<circle cx=${p[0]} cy=${p[1]} r=3 fill=${C[k]} />`).join('')});
 rows.forEach((r,i)=>{if(i%Math.ceil(rows.length/8)==0)s+=`<text x=${x(i)} y=${H+26} fill=#8b949e font-size=11 text-anchor=middle>${r.day.slice(5)}</text>`});return s+'</svg>'}
const LG=`<div class="lg mut"><span><i style="background:${C.dir1}"></i>напрям top-1</span><span><i style="background:${C.dir3}"></i>напрям top-3</span><span><i style="background:${C.tgt1}"></i>ціль top-1</span><span><i style="background:${C.tgt3}"></i>ціль top-3</span></div>`;
(async()=>{const S=await J('acc/summary.json');const el=document.getElementById('live');
 if(!S){el.innerHTML='<h2>Живі прогнози</h2><p class=mut>Ще немає даних: журнал веде live.yml (гілка data, acc/summary.json).</p>';return}
 const R=S.rolling,ks=['24h','7d','30d'];
 el.innerHTML=`<h2>Живі прогнози трекера</h2>${bars(ks.map(k=>R[k]),['dir1','dir3','tgt1','tgt3'],['24 год','7 днів','30 днів'])}${LG}
 <table><tr><th>Вікно</th><th>прогнозів</th><th>напрям: n</th><th>top-1</th><th>top-3</th><th>ціль: n</th><th>top-1</th><th>top-3</th></tr>
 ${ks.map(k=>`<tr><td>${k}</td><td>${R[k].n}</td><td>${R[k].n_dir}</td><td>${P(R[k].dir1)}</td><td>${P(R[k].dir3)}</td><td>${R[k].n_tgt}</td><td>${P(R[k].tgt1)}</td><td>${P(R[k].tgt3)}</td></tr>`).join('')}</table>
 <p class=mut>Випадкове вгадування напрямку (8 секторів): top-1 ${P(S.baseline.dir1)}, top-3 ${P(S.baseline.dir3)}. Курс відомий / невідомий: top-1 ${P(S.by_conf.course_known.dir1)} (n=${S.by_conf.course_known.n_dir}) / ${P(S.by_conf.course_unknown.dir1)} (n=${S.by_conf.course_unknown.n_dir}).
 Напрям перевіряється першим наступним спостереженням тієї самої цілі (≥12 км, ≤60 хв); ціль — місто ≤25 км від останнього положення, коли ціль зникла. Очікують перевірки: ${S.pending}. Оновлено ${t(S.generated)}.</p>`;
 document.getElementById('daily').innerHTML=`<h2>По днях (влучання прогнозу)</h2>${lines(S.daily,['dir1','tgt1','tgt3'],S.baseline.dir1)}${LG}<p class=mut>Пунктир — випадкове вгадування напрямку (12.5%).</p>`})();
(()=>{const b=BT&&BT.backtest;const el=document.getElementById('bt');if(!b){el.innerHTML='<h2>Бектест історичної моделі</h2><p class=mut>немає data/history_model.json</p>';return}
 const e=b.next_dir.explicit_heading||{},tg=b.target||{};
 el.innerHTML=`<h2>Бектест історичної моделі (відкладені хвилі)</h2>
 ${bars([{dir1:(e.uniform||{}).top1,tgt1:(tg.distance_only||{}).top1,tgt3:(tg.distance_only||{}).top3},{dir1:(e.field||{}).top1,tgt1:(tg.history_prior||{}).top1,tgt3:(tg.history_prior||{}).top3}],['dir1','tgt1','tgt3'],['без моделі (рівномірно / лише відстань)','історична модель'])}${LG}
 <p class=mut>Наступний напрям при явному «курсом на» (n=${e.n||0}), ціль атаки (n=${tg.n||0}). Модель побудована ${t(BT.built)} з ${BT.stats?BT.stats.posts:'?'} постів, ${BT.stats?BT.stats.waves:'?'} хвиль.
 Параметри: P(ціль) base=${b.params?b.params.base:'?'}, γ=${b.params?b.params.gamma:'?'}, λ=${b.params?b.params.lam:'?'} км; trk_w=${PRM.trk_w}, prior_mix=${PRM.prior_mix}.</p>`})();
(()=>{const el=document.getElementById('cal');if(!CAL.length){el.innerHTML='<h2>Щотижнева перекалібровка</h2><p class=mut>Ще не запускалась (history.yml, понеділок).</p>';return}

 ${CAL.slice().reverse().map(c=>`<tr><td>${t(c.ts)}</td><td>trk_w ${c.current.trk_w}, mix ${c.current.prior_mix}</td><td>trk_w ${c.proposed.trk_w}, mix ${c.proposed.prior_mix}</td><td>${c.holdout.current.ll}</td><td>${c.holdout.proposed.ll}</td><td class=${c.accepted?'ok':'bad'}>${c.accepted?'прийнято':'відхилено'}</td></tr>`).join('')}</table>
 <p class=mut>Пошук по сітці на останніх 60 хвилях: перша половина — вибір, друга — перевірка (holdout). Нові ваги приймаються, лише якщо на holdout краще (лог-правдоподібність наступного кроку, рівномірний = ${CAL[CAL.length-1].holdout.uniform.ll}).</p>`})();
</script>
