; CYD Alert — карта повітряних тривог для ESP32-2432S028 (Cheap Yellow Display)
[platformio]
default_envs = cyd

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; два слоти по 1984 КБ для OTA (huge_app — один слот 3 МБ, OTA неможлива); NVS на тому ж місці (0x9000)
board_build.partitions = partitions_ota.csv
monitor_filters = esp32_exception_decoder
extra_scripts = pre:tools/gen_data.py
lib_deps =
    lvgl/lvgl@8.3.11
    bodmer/TFT_eSPI@2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
    bblanchon/ArduinoJson@7.2.1
build_flags =
    -Os
    -DCORE_DEBUG_LEVEL=1
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -Iinclude
    ; ---------- TFT_eSPI setup for CYD (ESP32-2432S028R) ----------
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DUSE_HSPI_PORT=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000
    -DLOAD_GLCD=1
    -DSMOOTH_FONT=1

[env:cyd]
; стандартна плата з одним micro-USB (ILI9341)
build_flags =
    ${env.build_flags}
    -DFW_ENV=\"cyd\"

[env:cyd2usb]
; версія з двома портами (USB-C + micro-USB) — ST7789 з інверсією
build_flags =
    ${env.build_flags}
    -UILI9341_2_DRIVER
    -DST7789_DRIVER=1
    -DTFT_INVERSION_ON=1
    -DFW_ENV=\"cyd2usb\"
