<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width">
<title>CYD Alert</title><style>
body{background:#0d1117;color:#e6edf3;font:15px system-ui;margin:0;padding:20px;max-width:760px;margin:auto}
.card{background:#161b22;border-radius:14px;padding:16px;margin:12px 0;border-left:6px solid #3fb950}
.yellow{border-color:#f2c94c}.orange{border-color:#ff8c1a}.red{border-color:#ff4d4f}body{transition:background .6s}body.Lyellow{background:#1d1a0d}body.Lorange{background:#2a1606}body.Lred{background:#3a0b0d;box-shadow:inset 0 0 0 8px #ff4d4f;min-height:100vh}.mut{color:#8b949e;font-size:13px}
h1{font-size:22px}select,input{background:#161b22;color:#e6edf3;border:1px solid #30363d;border-radius:8px;padding:6px}
</style><h1>🛡 CYD Alert <span class=mut id=gen></span> <a class=mut href="stats.html" style="color:#58a6ff">📈 точність прогнозів</a></h1>
<div>Місто <select id=c></select> Район <select id=d></select></div><div id=st></div><div id=tg></div><div id=out></div>
<script>
const L=%LOC%;const c=document.getElementById('c'),d=document.getElementById('d');
L.cities.forEach(x=>c.add(new Option(x.name,x.id)));c.value='kremenchuk';
function fd(){d.innerHTML='';d.add(new Option('—',''));(L.cities.find(x=>x.id==c.value).districts||[]).forEach(x=>d.add(new Option(x.name,x.id)))}
c.onchange=()=>{fd();go()};d.onchange=go;fd();
// Свіжі дані (щохвилини) — у гілці data: raw.githubusercontent.com (кеш CDN до 5 хв); резерв — цей сайт (Pages, раз на годину)
const GH=location.hostname.match(/^([^.]+)\.github\.io$/),REPO=location.pathname.split('/')[1];
const RAW=GH&&REPO?`https://raw.githubusercontent.com/${GH[1]}/${REPO}/data/`:null;
let SRC='';
const J=async u=>{for(const b of (RAW?[RAW,'']:[''])){try{const r=await fetch(b+u+(b?'':'?t='+Date.now()));if(r.ok){SRC=b?'гілка data':'Pages';return r.json()}}catch(e){}}throw new Error('немає даних')};
const t=s=>s?new Date(s*1000).toLocaleTimeString('uk'):'—';
async function go(){const q=`city=${c.value}&district=${d.value}`;
 const s=await J(`api/state/${c.value}${d.value?'/'+d.value:''}.json`);
 document.getElementById('gen').textContent='оновлено '+t(s.generated);
 const SC={district:'🔴 Летить на ваш район',city:'➡️ Летить у бік міста',raion:'↗️ У бік району, не на місто',oblast:'⬜ Не летить на місто (загроза в області)'};
 const HD={green:'🟢 Чисто',yellow:'🟡 Увага · ціль в області',orange:'🟠 Курс на ваше місто',red:'🔴 Небезпека поруч'}[s.final];
 const qt=s.thr&&s.thr.includes(' · ');const thr=s.final=='green'?(qt?s.thr:''):(qt?s.thr:((s.thr&&s.thr!='Загроз немає')?s.thr.split(',')[0]:(s.kind||'Ціль')));
 const sc=(s.final=='green'||qt)?'':(SC[s.scope||{red:'district',orange:'city'}[s.final]]||'');
 document.body.className='L'+s.final;document.getElementById('st').innerHTML=`<div class="card ${s.final}"><b>${HD}</b>`+[thr,sc,s.final!='green'&&s.final!='red'&&s.p_near!=null?`Проліт поруч за 30 хв: ${s.p_near}%${s.p_near&&s.eta>=0?' (~'+s.eta+' хв)':''}`:'',s.lt&&s.lp?`Ймовірна ціль: ${s.lt} — ${s.lp}%`:''].filter(Boolean).map(x=>'<br>'+x).join('')+`</div>`;
 const g=await J(`api/targets/${c.value}.json`);const S=g.summary;
 document.getElementById('tg').innerHTML=`<div class=card style="border-color:#58a6ff"><b>🎯 Цілі (${g.targets.length})</b> · P(≤${g.user?g.user.R:15} км, 30 хв): дрони ${Math.round(S.p_drone[30]*100)}%, ракети ${Math.round(S.p_missile[30]*100)}%${S.eta_min!=null?' · ETA '+Math.round(S.eta_min)+' хв':''}<br>`+
  g.targets.map(x=>`<span class=mut>${x.label}${x.count>1?' ×'+x.count:''} · ${x.dist_km!=null?x.dist_km+' км':'—'}${x.eta_min!=null?' · ETA '+x.eta_min+' хв':''}</span>`).join('<br>')+`</div>`;
}
const OC=['#2ea043','#5b6573','#f59e0b'];
async function outg(){const ci=L.cities.find(x=>x.id==c.value);const o=await J(`api/outage/${ci.oblast}/${document.getElementById('g').value}.json`).catch(()=>({days:[],err:'немає джерела для області'}));
 document.getElementById('ob').innerHTML=(o.days||[]).map(dd=>`<div class=mut>${dd.date}</div><div style="display:flex;gap:1px">${[...dd.cells].map(v=>`<span style="flex:1;height:14px;background:${OC[v]}"></span>`).join('')}</div>`).join('')||('— '+(o.err||''));
 document.getElementById('os').textContent=(o.src||'')+' '+(o.updated||'')}
document.getElementById('out').innerHTML=`<div class=card style="border-color:#5b6573"><b>⚡ Відключення</b> черга <select id=g>${%GROUPS%.map(x=>`<option>${x}</option>`).join('')}</select> <span id=os class=mut></span><div id=ob></div></div>`;
document.getElementById('g').onchange=outg;
go();outg();setInterval(go,60000);
</script>
